<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel — Santy Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
  <style>
    body.admin-body { min-height: 100vh; }
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .login-card { width: 100%; max-width: 360px; background: var(--surface); border-radius: var(--radius);
                  box-shadow: var(--shadow); padding: 2rem; }
    .login-card h1 { font-size: 1.4rem; margin-bottom: .3rem; }
    .login-card p.sub { color: var(--gris); font-size: .92rem; margin-bottom: 1.4rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-weight: 700; font-size: .88rem; margin-bottom: .35rem; }
    .field input { width: 100%; min-height: 48px; padding: .6rem 1rem; border: 2px solid var(--rosa-200);
                   border-radius: 12px; font: 500 1rem var(--body); color: var(--texto); background: var(--surface); }
    .field input:focus { border-color: var(--rosa-700); outline: none; box-shadow: 0 0 0 3px rgba(190,24,93,.18); }
    .login-card .btn { width: 100%; margin-top: .4rem; }
    #loginError:empty { display: none; }
    #loginError { color: var(--rosa-700); text-align: left; }

    .admin-header { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 0; }
    .admin-header h1 { font-size: 1.3rem; }

    #listMsg:empty { display: none; }
    #listMsg { color: var(--rosa-700); }
    .admin-table { width: 100%; border-collapse: collapse; font-size: .92rem; margin-bottom: 1.5rem; }
    .admin-table th, .admin-table td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--rosa-200); }
    .admin-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; display: block; background: var(--rosa-200); }
  </style>
</head>
<body class="admin-body">

<section id="authGate">
  <div class="auth-wrap">
    <div class="login-card">
      <h1>Panel Santy Kids</h1>
      <p class="sub">Inicia sesión para administrar el catálogo.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">Correo</label>
          <input id="loginEmail" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required />
        </div>
        <p id="loginError" class="count" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
    </div>
  </div>
</section>

<div id="adminApp" hidden>
  <div class="wrap">
    <div class="admin-header">
      <h1>Santy<span style="color:var(--rosa-700)">Kids</span> · Panel</h1>
      <button type="button" id="logoutBtn" class="btn btn-ghost">Cerrar sesión</button>
    </div>
    <p id="listMsg" class="count" aria-live="polite"></p>
    <div id="productList"></div>
    <div id="productForm" hidden></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
