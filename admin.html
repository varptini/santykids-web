<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel — Santy Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/admin-manifest.json" />
  <link rel="apple-touch-icon" href="/icons/admin-192.png" />
  <meta name="theme-color" content="#be185d" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
  <style>
    body.admin-body { min-height: 100vh; }
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .login-card { width: 100%; max-width: 360px; background: var(--surface); border-radius: var(--radius);
                  box-shadow: var(--shadow); padding: 2rem; }
    .login-card h1 { font-size: 1.4rem; margin-bottom: .3rem; }
    .login-card p.sub { color: var(--gris); font-size: .92rem; margin-bottom: 1.4rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-weight: 700; font-size: .88rem; margin-bottom: .35rem; }
    .field input, .field textarea, .field select { width: 100%; min-height: 48px; padding: .6rem 1rem; border: 2px solid var(--rosa-200);
                   border-radius: 12px; font: 500 1rem var(--body); color: var(--texto); background: var(--surface); }
    .field textarea { min-height: 90px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--rosa-700); outline: none; box-shadow: 0 0 0 3px rgba(190,24,93,.18); }
    .login-card .btn { width: 100%; margin-top: .4rem; }
    #loginError:empty { display: none; }
    #loginError { color: var(--rosa-700); text-align: left; }

    .admin-header { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 0; }
    .admin-header h1 { font-size: 1.3rem; }

    #listMsg:empty { display: none; }
    #listMsg { color: var(--rosa-700); }
    .admin-table { width: 100%; border-collapse: collapse; font-size: .92rem; margin-bottom: 1.5rem; }
    .admin-table th, .admin-table td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--rosa-200); }
    .admin-thumb { width: 48px; min-width: 48px; max-width: 48px; height: 48px; object-fit: cover; border-radius: 8px; display: block; background: var(--rosa-200); }

    .admin-list-header { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .admin-list-header .btn { flex: none; min-height: 44px; padding: .5rem 1.2rem; }
    .admin-table td:last-child { text-align: right; white-space: nowrap; }
    .row-menu { position: relative; display: inline-block; }
    .menu-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--rosa-200); background: var(--rosa-50);
                color: var(--rosa-700); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
    .menu-btn:hover, .menu-btn[aria-expanded="true"] { border-color: var(--rosa-700); }
    .menu-panel { position: absolute; right: 0; top: calc(100% + 8px); z-index: 5; display: flex; gap: .35rem;
                  background: var(--surface); padding: .4rem; border-radius: 999px; box-shadow: var(--shadow); border: 2px solid var(--rosa-200); }
    .menu-panel[hidden] { display: none; }
    .menu-item { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--rosa-50); color: var(--rosa-700);
                 display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: background-color .2s, transform .2s; }
    .menu-item:hover { background: var(--rosa-200); transform: scale(1.08); }
    .menu-item.menu-delete { background: #fee2e2; color: #b91c1c; }
    .menu-item.menu-delete:hover { background: #fecaca; }
    .menu-item svg, .menu-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .menu-btn svg.dots { fill: currentColor; stroke: none; }
    .admin-header .btn { min-height: 44px; padding: .5rem 1.2rem; }
    #buscar { flex: 1; max-width: 360px; min-height: 44px; padding: .5rem .9rem; border: 2px solid var(--rosa-200);
              border-radius: 12px; font: 500 .95rem var(--body); color: var(--texto); background: var(--surface); }
    #buscar:focus { border-color: var(--rosa-700); outline: none; box-shadow: 0 0 0 3px rgba(190,24,93,.18); }
    #productForm { max-width: 480px; }
    #formMsg:empty { display: none; }
    #formMsg { color: var(--rosa-700); }
    .form-actions { display: flex; gap: .75rem; margin-top: 1.2rem; }
    .form-actions .btn { flex: 1; }

    #fImagePreview { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .6rem; }
    .img-preview-item { position: relative; width: 72px; height: 72px; }
    .img-preview-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px;
                             border: 2px solid var(--rosa-200); display: block; }
    .img-preview-item .img-remove { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px;
                                     border-radius: 50%; border: none; background: var(--rosa-700); color: #fff;
                                     font: 700 .9rem/1 var(--body); cursor: pointer; display: flex;
                                     align-items: center; justify-content: center; padding: 0; }
  </style>
</head>
<body class="admin-body">

<section id="authGate">
  <div class="auth-wrap">
    <div class="login-card">
      <h1>Panel Santy Kids</h1>
      <p class="sub">Inicia sesión para administrar el catálogo.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">Correo</label>
          <input id="loginEmail" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required />
        </div>
        <p id="loginError" class="count" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
    </div>
  </div>
</section>

<div id="adminApp" hidden>
  <div class="wrap">
    <div class="admin-header">
      <h1>Santy<span style="color:var(--rosa-700)">Kids</span> · Panel</h1>
      <button type="button" id="logoutBtn" class="btn btn-ghost">Cerrar sesión</button>
    </div>
    <div class="admin-list-header">
      <input id="buscar" type="search" placeholder="Buscar por nombre, categoría o #id" aria-label="Buscar productos" />
      <button type="button" id="newProductBtn" class="btn btn-primary">+ Nuevo producto</button>
    </div>
    <p id="listMsg" class="count" aria-live="polite"></p>
    <div id="productList"></div>

    <div id="productForm" hidden>
      <form id="productFormEl" novalidate>
        <div class="field">
          <label for="fNombre">Nombre</label>
          <input id="fNombre" type="text" required />
        </div>
        <div class="field">
          <label for="fDescripcion">Descripción</label>
          <textarea id="fDescripcion" rows="3"></textarea>
        </div>
        <div class="field">
          <label for="fHashtags">Hashtags</label>
          <input id="fHashtags" type="text" />
        </div>
        <div class="field">
          <label for="fPrecio">Precio</label>
          <input id="fPrecio" type="number" step="0.01" />
        </div>
        <div class="field">
          <label for="fCategoria">Categoría</label>
          <input id="fCategoria" type="text" list="categoriaList" />
          <datalist id="categoriaList"></datalist>
        </div>
        <div class="field">
          <label for="fStock">Stock</label>
          <input id="fStock" type="number" step="1" />
        </div>
        <div class="field">
          <label for="fEstado">Estado</label>
          <select id="fEstado">
            <option value="borrador">Borrador</option>
            <option value="publicado">Publicado</option>
            <option value="archivado">Archivado</option>
          </select>
        </div>
        <div class="field">
          <label for="fImagenes">Fotos</label>
          <input id="fImagenes" type="file" accept="image/*" multiple />
          <div id="fImagePreview"></div>
        </div>
        <p id="formMsg" aria-live="polite"></p>
        <div class="form-actions">
          <button type="submit" id="formSaveBtn" class="btn btn-primary">Guardar</button>
          <button type="button" id="formCancelBtn" class="btn btn-ghost">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw-admin.js');
</script>
</body>
</html>
